$kind: http-example
name: healthy-response
request:
  url: "{{base_url}}/v1/health"
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "status": "healthy",
        "uptime": 123456,
        "version": "2.1.0"
      }

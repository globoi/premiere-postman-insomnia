$kind: graphql-request
name: get lives
url: "{{JARVIS_URL}}/graphql"
query: |
  query Broadcasts($filtersInput: BroadcastInput) {
      broadcasts(filtersInput: $filtersInput) {
          mediaId
          transmissionId
          name
          media {
              description
              title {
                  headline
              }
              headline
              thumb
              channel {
                  id
              }
              authorizationExternalIds {
                  aeid
                  type
              }
          }
          channelId
          slug
          epgCurrentSlots(limit: 1) {
              relatedEventId
              name
              description
              relatedEvent {
                  ... on SoccerMatch {
                      id
                      matchId
                  }
              }
          }
          affiliateCode
      }
  }
variables: '{"filtersInput":{"affiliateCode":"dsafasdf"}}'

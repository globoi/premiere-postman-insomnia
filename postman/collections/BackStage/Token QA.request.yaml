$kind: http-request
url: https://accounts.backstage.qa.globoi.com/token
method: POST
body:
  type: urlencoded
  content:
    grant_type: client_credentials
    client_id: "{{backstage_client_id}}"
    client_secret: "{{backstage_client_secret}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |
      const response = pm.response.json();
      const authToken = response.access_token;

      pm.environment.set("auth_token_backstage", authToken);
    language: text/javascript
order: 6000

$kind: graphql-request
name: query matchHighlights
url: "{{geql_url}}/graphql"
query: |-
  query GetMatchHighlights($matchId: Int!) {
      matchHighlights(matchId: $matchId) {
          id
          title
          duration
          thumbnail_url
      }
  }
variables: |-
  {
      "matchId": 346416
  }
schema:
  source: auto
order: 4000

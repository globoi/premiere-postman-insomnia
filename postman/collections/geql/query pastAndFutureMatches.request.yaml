$kind: graphql-request
name: query pastAndFutureMatches
url: "{{geql_url}}/graphql"
query: |-
  query pastAndFutureMatches($days: Int!) {
    pastAndFutureMatches(days: $days) {
      PastMatches {
        ...MatchFields
      }
      FutureMatches {
        ...MatchFields
      }
    }
  }

  fragment MatchFields on Match {
    id
    startDate
    startHour
  }
variables: |-
  {
      "days": 3
  }
schema:
  source: auto
order: 2000
